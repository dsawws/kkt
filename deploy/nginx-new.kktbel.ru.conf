# =========================================================
# Nginx — new.kktbel.ru
# Проксирует приложение на Gunicorn 127.0.0.1:8041
#
# ВАЖНО: /static/ обслуживается ТОЛЬКО из одного каталога STATIC_ROOT
# (django_admin/staticfiles), который заполняется командой:
#
#   cd /var/www/html/django_admin
#   source venv/bin/activate
#   python manage.py collectstatic --noinput
#
# Не добавляйте отдельные location для ckeditor/mptt/admin/panel —
# collectstatic уже кладёт их в staticfiles/.
# =========================================================
upstream kktbel_app {
    server 127.0.0.1:8041;
    keepalive 8;
}

server {
    listen 8042;
    listen [::]:8042;

    # При наличии TLS раскомментируйте и укажите сертификаты:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/new.kktbel.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/new.kktbel.ru/privkey.pem;

    client_max_body_size 64M;

    # Единая статика Django (после collectstatic)
    # Без try_files: с alias он часто ломает пути. Нет файла → nginx 404.
    location /static/ {
        alias /var/www/html/django_admin/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Медиа: загрузки через панель / CKEditor
    location /media/ {
        alias /var/www/html/django_admin/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Legacy /uploads/ (старые абсолютные ссылки на PDF и т.п.)
    # Не путать со STATIC. Новые загрузки идут в /media/.
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Приложение (панель, сайт, API, CKEditor upload endpoints)
    location / {
        proxy_pass http://kktbel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}

# =============================================================================
# Nginx — new.kktbel.ru (HTTPS)
# Проксирует приложение на Gunicorn 127.0.0.1:8041
#
# Статика: только django_admin/staticfiles после collectstatic
#   bash /var/www/html/deploy/collectstatic.sh
# =============================================================================

upstream kktbel_app {
    server 127.0.0.1:8041;
    keepalive 8;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name new.kktbel.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name new.kktbel.ru;

    # Пути Let's Encrypt (certbot). При другом CA — поправьте.
    ssl_certificate     /etc/letsencrypt/live/new.kktbel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.kktbel.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    # ── Единая статика Django (после collectstatic) ───────────────────
    location /static/ {
        alias /var/www/html/django_admin/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Медиа: загрузки панели / CKEditor / Документы (PDF) ───────────
    location /media/ {
        alias /var/www/html/django_admin/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Legacy /uploads/ ─────────────────────────────────────────────
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Приложение ───────────────────────────────────────────────────
    location / {
        proxy_pass http://kktbel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}

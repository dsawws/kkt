# =============================================================================
# Nginx — new.kktbel.ru
#
# Конечная схема (TSO):
#   Nginx слушает HTTP :8051 и маршрутизирует на бэкенд Gunicorn :8052
#   Файл на сервере: /var/www/html/deploy/nginx-new.kktbel.ru.conf
#
# Статика: только django_admin/staticfiles после collectstatic
#   bash /var/www/html/deploy/collectstatic.sh
#
# TLS обычно терминируется внешним прокси/балансировщиком перед :8051.
# =============================================================================

upstream kktbel_app {
    server 127.0.0.1:8052;
    keepalive 8;
}

server {
    listen 8051;

    client_max_body_size 64M;

    # ── Единая статика Django (после collectstatic) ───────────────────
    location /static/ {
        alias /var/www/html/django_admin/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Медиа: загрузки панели / CKEditor / Документы (PDF) ───────────
    location /media/ {
        alias /var/www/html/django_admin/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Legacy /uploads/ ─────────────────────────────────────────────
    location /uploads/ {
        alias /var/www/html/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Бэкенд (Gunicorn) ────────────────────────────────────────────
    location / {
        proxy_pass http://kktbel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Публичный сайт — HTTPS (TLS снаружи); nginx здесь HTTP на :8042.
        # Если внешний прокси уже шлёт X-Forwarded-Proto — замените на $http_x_forwarded_proto.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}
